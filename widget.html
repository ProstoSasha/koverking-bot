  var WD = ["пн", "вт", "ср", "чт", "пт", "сб", "вс"];

  var STORE_KEY = "kv_booking", CERT_KEY = "kv_cert";
  var NO_BACK = ["pay", "checking", "confirmed", "outDone", "resume", "expired", "certPay", "certChecking", "certDone", "certResume"];
  var cfg = null, st = {}, hist = [], pollTimer = null, lastWhat = null, current = null, priceFmt = null, takenNote = false;

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function rub(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " "); }
  function parseDay(s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function iso(d) { return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }
  function shortDay(s) { var d = parseDay(s), w = (d.getDay() + 6) % 7; return WD[w] + " " + ("0" + d.getDate()).slice(-2) + "." + ("0" + (d.getMonth() + 1)).slice(-2); }
  function rugsWord(n) { var a = n % 10, b = n % 100; return a === 1 && b !== 11 ? "коврик" : a >= 2 && a <= 4 && (b < 12 || b > 14) ? "коврика" : "ковриков"; }
  function certPrice(size, n) { return n <= 4 ? cfg.cert_prices[size][n] : cfg.cert_per_from_4[size] * n; }
  function save(k, v) { try { v ? localStorage.setItem(k, JSON.stringify(v)) : localStorage.removeItem(k); } catch (e) {} }
  function load(k, hours) { try { var v = JSON.parse(localStorage.getItem(k) || "null"); return v && Date.now() - v.ts < hours * 3600e3 ? v : null; } catch (e) { return null; } }

  function api(path, data) {
    var opt = data ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) } : {};
    return fetch(API + path, opt).then(function (r) {
      return r.json().catch(function () { return { ok: false, error: "server" }; }).then(function (j) { j._status = r.status; return j; });
    });
  }

  // ---------------- открыть / закрыть ----------------
  // what: {mode:"book"|"cert", fmt, occasion, wedding, size, kind}
  function open(what) {
    what = what || { mode: "book" };
    lastWhat = what;
    ov.classList.add("kv-open");
    document.documentElement.style.overflow = "hidden";
    hist = []; st = {}; current = null; takenNote = false;
    var ready = cfg ? Promise.resolve() : api("/api/config").then(function (j) { if (j.ok) cfg = j; else throw j; });
    loading();
    ready.then(function () { start(what); }).catch(netError);
  }
  function start(what) {
    if (what.mode === "cert") {
      var sc = load(CERT_KEY, 72);
      if (sc && !what.size) { st = { cert: sc.cert }; return showStatic("certResume"); }
      st = { csize: what.size || null, ckind: what.kind || null };
      return show(st.csize ? "certQty" : "certSize");
    }
    var saved = load(STORE_KEY, 7);
    if (saved && !what.fmt) { st = saved.st || {}; st.booking = saved.booking; return showStatic("resume"); }
    if (!what.fmt) return show("format");
    current = "format";  // чтобы «Назад» вело к выбору формата
    pickFormat(what.fmt, what);
  }
  function close() { ov.classList.remove("kv-open"); document.documentElement.style.overflow = ""; stopPoll(); }
  function loading() { body.innerHTML = '<div class="kv-spin"></div>'; }
  function netError(j) {
    var msg = j && j._status === 429 ? TEXT.tooMany : TEXT.netErr;
    body.innerHTML = '<p class="kv-err">' + msg + '</p><button class="kv-btn kv-btn2" data-a="retry">Попробовать ещё раз</button>';
  }

  // навигация: show(шаг) запоминает историю для кнопки «Назад»
  function show(step, noHistory) {
    if (current && !noHistory && current !== step) hist.push(current);
    current = step; stopPoll();
    backBtn.style.visibility = hist.length && NO_BACK.indexOf(step) < 0 ? "visible" : "hidden";
    titleEl.textContent = step.indexOf("cert") === 0 ? TEXT.certTitle : TEXT.title;
    (STEPS[step] || STEPS.format)();

  function onClick(e) {
    if (e.target === ov) return close();
    var el = e.target.closest("[data-a]");
    if (!el) return;
    var a = el.getAttribute("data-a"), v = el.getAttribute("data-v");
    if (a === "close") return close();
    if (a === "back") return back();
    if (a === "retry") return open(lastWhat);
    if (a === "restart") { save(STORE_KEY, null); st = {}; hist = []; current = null; return show("format"); }
    if (a === "resume") { current = null; return api("/api/status?id=" + encodeURIComponent(st.booking.id)).then(function (j) {
      if (!j.ok || j.status === "expired") return show("expired");
      if (j.status === "paid") { st.deadline = j.deadline; return show("confirmed"); }
      show(j.status === "checking" ? "checking" : "pay");
    }).catch(netError); }
    if (a === "goto") return show(v);
    if (a === "price") { priceFmt = v; return show("price"); }
    if (a === "fmt") return pickFormat(v);
    if (a === "slot") { st.day = el.getAttribute("data-day"); st.time = el.getAttribute("data-time"); st.free = +el.getAttribute("data-free"); return show("count"); }
    if (a === "count") { st.count = +v; return show(st.count === 1 ? "size" : "contacts"); }
    if (a === "size") { st.size = v; return show("contacts"); }
    if (a === "occasion") {
      var oc = TEXT.occasions.filter(function (o) { return o.code === v; })[0];
      if (oc && oc.value) { st.occasion = oc.value; return show("bdayCount"); }
      var of = body.querySelector('[data-form="occasion"]'); of.hidden = false; of.querySelector("input").focus(); return;
    }
    if (a === "wedding") { st = { fmt: "out", wedding: true }; return show("outForm"); }
    if (a === "bcount") {
      if (v === "more") { st.outCount = cfg.bday.max + "+"; return show("tooMany"); }
      st.count = +v; st.days = null; return show("calendar");
    }
    if (a === "tooManyOut") { var oc2 = st.outCount; st = { fmt: "out", outCount: oc2 }; return show("outForm"); }
    if (a === "month") { var mm = st.month[0] * 12 + st.month[1] + (+v); st.month = [Math.floor(mm / 12), mm % 12]; return show("calendar", true); }
    if (a === "day") { st.day = v; return show("times"); }
    if (a === "time") { st.time = v; return show("contacts"); }
    if (a === "place") {
      el.parentNode.querySelectorAll(".kv-chip").forEach(function (c) { c.classList.remove("kv-on"); });
      el.classList.add("kv-on"); el.closest("form").querySelector('[name="where"]').value = v; return;
    }
    if (a === "certOpen") { var f = body.querySelector('[data-form="cert"]'); f.hidden = false; f.querySelector("input").focus(); return; }
    if (a === "paid") {
      el.disabled = true;
      return api("/api/paid", { id: st.booking.id }).then(function (j) {
        if (j.ok) return show("checking");
        if (j.error === "expired" || j.error === "not_found") return show("expired");
        el.disabled = false; netError(j);
      }).catch(netError);
    }
    // сертификаты
    if (a === "csize") { st.csize = +v; return show("certQty"); }
    if (a === "cqty") return gotQty(+v);
    if (a === "cmore") { var qf = body.querySelector('[data-form="cqty"]'); qf.hidden = false; qf.querySelector("input").focus(); return; }
    if (a === "cfiles") { st.csep = v === "sep"; return st.ckind ? show("certContacts") : show("certType"); }
    if (a === "ctype") { st.ckind = v; return show("certContacts"); }
    if (a === "cpaid") {
      el.disabled = true;
      return api("/api/cert-paid", { order: st.cert.order, key: st.cert.key }).then(function (j) {
        if (j.ok) return show("certChecking");
        el.disabled = false; netError(j);
      }).catch(netError);
    }
    if (a === "cresume") {
      var c = st.cert; current = null;
      return api("/api/cert-status?order=" + encodeURIComponent(c.order) + "&key=" + encodeURIComponent(c.key)).then(function (j) {
        if (!j.ok) { save(CERT_KEY, null); st = {}; return show("certSize"); }
        if (j.status === "paid") { st.done = j; return show("certDone"); }
        show(j.status === "checking" ? "certChecking" : "certPay");
      }).catch(netError);
    }
    if (a === "cnew") { save(CERT_KEY, null); st = {}; hist = []; current = null; return show("certSize"); }
  }
  function gotQty(n) { st.cqty = n; if (n > 1) return show("certFiles"); st.csep = false; return st.ckind ? show("certContacts") : show("certType"); }

  function onSubmit(e) {
    e.preventDefault();
    var form = e.target, kind = form.getAttribute("data-form"), fd = {};
    Array.prototype.forEach.call(form.elements, function (x) { if (x.name) fd[x.name] = x.value.trim(); });
    var btn = form.querySelector('[type="submit"]');
    if (kind === "occasion") {
      if (!fd.occasion) return showErr(form, TEXT.occasionOther);
      st.occasion = fd.occasion; return show("bdayCount");
    }
    if (kind === "cqty") {
      var n = parseInt(fd.qty, 10);
      if (!(n >= 1 && n <= 50)) return showErr(form, TEXT.certMoreLabel);
      return gotQty(n);
    }
    if (kind === "cert") {
      if (!fd.code) return showErr(form, TEXT.certLabel);
      btn.disabled = true;
      return api("/api/cert", { id: st.booking.id, code: fd.code }).then(function (j) {
        if (j.ok) { st.deadline = j.deadline; return show("confirmed"); }
        if (j.error === "expired" || j.error === "not_found") return show("expired");
        btn.disabled = false; showErr(form, TEXT.netErr);
      }).catch(function () { btn.disabled = false; showErr(form, TEXT.netErr); });
    }
    if (!fd.name) return showErr(form, TEXT.badName);
    if (!phoneOk(fd.phone)) return showErr(form, TEXT.badPhone);
    st.name = fd.name; st.phone = fd.phone;
    if (kind === "certOrder") {
      if (st.ckind === "pdf" && (cfg.email_enabled || fd.email) && !emailOk(fd.email || "")) return showErr(form, TEXT.badEmail);
      st.email = fd.email;
      btn.disabled = true;
      return api("/api/cert-order", { size: st.csize, qty: st.cqty, separate: !!st.csep, kind: st.ckind, name: fd.name, phone: fd.phone, email: fd.email || "", website: fd.website }).then(function (j) {
        if (!j.ok) { btn.disabled = false; return showErr(form, j.error === "bad_email" ? TEXT.badEmail : j._status === 429 ? TEXT.tooMany : TEXT.netErr); }
        st.cert = j; save(CERT_KEY, { ts: Date.now(), cert: j }); hist = []; show("certPay");
      }).catch(function () { btn.disabled = false; showErr(form, TEXT.netErr); });
    }
    btn.disabled = true;
    if (kind === "out") {
      return api("/api/outcall", fd).then(function (j) {
        if (!j.ok) { btn.disabled = false; return showErr(form, j._status === 429 ? TEXT.tooMany : TEXT.netErr); }
        st.booking = { id: j.id, tg_link: j.tg_link }; hist = []; show("outDone");
      }).catch(function () { btn.disabled = false; showErr(form, TEXT.netErr); });
    }
    var data = { fmt: st.fmt, day: st.day, time: st.time, count: st.count, size: st.size || "", occasion: st.occasion || "", name: fd.name, phone: fd.phone, comment: fd.comment, website: fd.website };
    api("/api/book", data).then(function (j) {
      if (j.ok) { st.booking = j; remember(); hist = []; return show("pay"); }
      btn.disabled = false;
      if (j.error === "taken") { st.days = null; takenNote = true; hist = []; current = null; return show(st.fmt === "group" ? "slots" : "calendar"); }
      showErr(form, j._status === 429 ? TEXT.tooMany : TEXT.netErr);
    }).catch(function () { btn.disabled = false; showErr(form, TEXT.netErr); });
  }

  // ---------------- какие ссылки что открывают ----------------
  function parseHref(href) {
    href = String(href || "");
    var i = href.indexOf("#"); if (i < 0) return null;
    var h = href.slice(i);
    if (TRIGGERS.indexOf(h) >= 0) return { mode: "book" };
    if (CERT_TRIGGERS.indexOf(h) >= 0) return { mode: "cert" };
    var m = h.match(/^#booking:(group|date|out|event)(?::(birthday|corporate|hen|other|wedding))?$/);
    if (m) {
      if (m[1] === "out" || m[2] === "wedding") return { mode: "book", fmt: "out", wedding: m[2] === "wedding" };
      return { mode: "book", fmt: m[1] === "event" ? "bday" : m[1], occasion: m[2] };
    }
    m = h.match(/^#gift:(30|40|50)(?::(pdf|print))?$/);
    if (m) return { mode: "cert", size: +m[1], kind: m[2] || null };
    return null;
  }

  function init() {
    var root = document.getElementById("kv-widget-root");
    ov = document.createElement("div");
    ov.className = "kv-ov";
    ov.innerHTML = '<div class="kv-box" role="dialog" aria-modal="true"><div class="kv-head">' +
      '<button class="kv-ic" data-a="back" aria-label="' + TEXT.back + '">←</button><h3></h3>' +
      '<button class="kv-ic" data-a="close" aria-label="' + TEXT.close + '">✕</button></div><div class="kv-body"></div></div>';
    document.body.appendChild(ov);
    body = ov.querySelector(".kv-body"); titleEl = ov.querySelector("h3"); backBtn = ov.querySelector('[data-a="back"]');
    if (SHOW_INLINE_BUTTON && root) root.innerHTML = '<div style="text-align:center"><a href="#booking" class="kv-btn kv-inline">Записаться на мастер-класс</a></div>';

    ov.addEventListener("click", onClick);
    ov.addEventListener("submit", onSubmit);
    ov.addEventListener("input", function (e) {  // начали исправлять — прячем ошибку
      var f = e.target.closest("form"), er = f && f.querySelector(".kv-err");
      if (er) er.hidden = true;
    });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape" && ov.classList.contains("kv-open")) close(); });

    // перехватываем кнопки сайта (#popup:order, #booking…, #popup:sert, #gift…) раньше Тильды
    window.addEventListener("click", function (e) {
      var a = e.target.closest && e.target.closest("a[href]");
      if (!a) return;
      var what = parseHref(a.getAttribute("href"));
      if (!what) return;
      e.preventDefault(); e.stopPropagation(); if (e.stopImmediatePropagation) e.stopImmediatePropagation();
      open(what);
    }, true);
    var fromHash = parseHref(location.hash);
    if (fromHash) setTimeout(function () { open(fromHash); }, 300);
    window.kvOpenBooking = function (fmt) { open({ mode: "book", fmt: fmt }); };
    window.kvOpenGift = function (size) { open({ mode: "cert", size: size }); };
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
